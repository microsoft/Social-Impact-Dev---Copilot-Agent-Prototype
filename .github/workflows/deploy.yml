name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_SYNC_PATH: 'apps/data-sync'
  EMAIL_UPDATE_PATH: 'apps/email-update'

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    outputs:
      functionAppName: ${{ steps.deploy.outputs.functionAppName }}
      emailFunctionAppName: ${{ steps.deploy.outputs.emailFunctionAppName }}
      eventGridSystemTopicName: ${{ steps.deploy.outputs.eventGridSystemTopicName }}
      containerName: ${{ steps.deploy.outputs.containerName }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FEC_COMMITTEE_IDS: ${{ vars.FEC_COMMITTEE_IDS }}
          FEC_REPORT_TYPES: ${{ vars.FEC_REPORT_TYPES }}
          EMAIL_CONNECTION_STRING: ${{ secrets.EMAIL_CONNECTION_STRING }}
          EMAIL_SENDER_ADDRESS: ${{ vars.EMAIL_SENDER_ADDRESS }}
          EMAIL_RECIPIENT_LIST: ${{ vars.EMAIL_RECIPIENT_LIST }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          deploymentName: main
          parameters: ./infra/main.bicepparam
          failOnStdErr: false

  deploy-data-sync:
    name: Deploy Data Sync Function
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Build function package
        run: |
          # Build workspace packages as wheels
          uv build --wheel packages/fec-api-client --out-dir dist/
          uv build --wheel packages/services --out-dir dist/

          # Export dependencies excluding workspace packages
          uv export --no-hashes --no-emit-package fec-api-client --no-emit-package services -o ${{ env.DATA_SYNC_PATH }}/requirements.txt

          cd ${{ env.DATA_SYNC_PATH }}

          # Create .python_packages directory for dependencies
          mkdir -p .python_packages/lib/site-packages

          # Install all dependencies including workspace wheels
          pip install --target .python_packages/lib/site-packages -r requirements.txt ../../dist/*.whl

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ needs.deploy-infrastructure.outputs.functionAppName }}
          package: ${{ env.DATA_SYNC_PATH }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false

  deploy-email-update:
    name: Deploy Email Update Function
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Build function package
        run: |
          # Build workspace packages as wheels
          uv build --wheel packages/fec-api-client --out-dir dist/
          uv build --wheel packages/services --out-dir dist/

          # Export dependencies excluding workspace packages
          uv export --no-hashes --no-emit-package fec-api-client --no-emit-package services -o ${{ env.EMAIL_UPDATE_PATH }}/requirements.txt

          cd ${{ env.EMAIL_UPDATE_PATH }}

          # Create .python_packages directory for dependencies
          mkdir -p .python_packages/lib/site-packages

          # Install dependencies and workspace wheels
          pip install --target .python_packages/lib/site-packages -r requirements.txt ../../dist/*.whl

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ needs.deploy-infrastructure.outputs.emailFunctionAppName }}
          package: ${{ env.EMAIL_UPDATE_PATH }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      - name: Deploy Event Grid Subscription
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/eventgrid-subscription.bicep
          parameters: >-
            eventGridTopicName=${{ needs.deploy-infrastructure.outputs.eventGridSystemTopicName }}
            emailFunctionAppName=${{ needs.deploy-infrastructure.outputs.emailFunctionAppName }}
            containerName=${{ needs.deploy-infrastructure.outputs.containerName }}
          failOnStdErr: false
